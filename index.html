<style>
/* 넥트멜레: 검은 바에 시험관 하나. 열 번 답하면 층층이 차오르고, 화면의 빛은 그 액체에서만 나온다.
   색: 브랜드 원본대로 검정 + 청록(#45C2C6). 글꼴: 한글은 Pretendard 하나, 영문 칵테일 이름만 EB Garamond(브랜드 매뉴얼 계열).
   간격 4/8 단위, 누르는 칸 48px 이상, 본문 대비 4.5:1 이상. */
:root {
  --bg: #070909; --fg: #F3F6F5; --mute: #9FAEAD; --line: rgba(243,246,245,.14); --card: rgba(243,246,245,.055);
  --nm: #45C2C6; --glow: #45C2C6; --err: #FF9C8F;
  --sans: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --name: "EB Garamond", "Cormorant Garamond", Georgia, serif;
  --gut-l: max(20px, env(safe-area-inset-left, 0px)); --gut-r: max(20px, env(safe-area-inset-right, 0px));
  --ease: cubic-bezier(.22,.8,.24,1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.6;
  word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; letter-spacing: -.01em; }
button, input { font: inherit; letter-spacing: inherit; }
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--nm); outline-offset: 3px; }
h2:focus { outline: none; }
p, .line, .from { text-wrap: pretty; }
.halo { position: fixed; inset: 0; pointer-events: none; opacity: .3; transition: background-color 1s; background-color: var(--glow);
  -webkit-mask-image: radial-gradient(60% 46% at 8% 82%, #000, transparent); mask-image: radial-gradient(60% 46% at 8% 82%, #000, transparent); }

.stage { position: relative; max-width: 620px; margin: 0 auto; padding: 0 var(--gut-r) 0 var(--gut-l);
  display: grid; grid-template-columns: 52px minmax(0, 1fr); column-gap: 24px; }

/* 시험관 */
.tubecol { position: sticky; top: 0; height: 100vh; height: 100svh; padding: 20px 0 calc(24px + env(safe-area-inset-bottom, 0px)); }
.glass { position: relative; height: 100%; width: 52px; margin: 0 auto; border-radius: 8px 8px 26px 26px; }
.glass .body { position: absolute; inset: 6px 3px 0; border-radius: 0 0 23px 23px; overflow: hidden; background: rgba(243,246,245,.04);
  box-shadow: inset 0 0 0 1px rgba(243,246,245,.28), inset 6px 0 10px -6px rgba(243,246,245,.25), inset -8px 0 14px -8px rgba(0,0,0,.8); }
.glass .lip { position: absolute; top: 0; left: 0; right: 0; height: 10px; border-radius: 50%; border: 1.5px solid rgba(243,246,245,.6); background: rgba(7,9,9,.6); }
.glass .liq { position: absolute; inset: 0; transform: translateY(100%); transition: transform .9s var(--ease); }
.glass .liq .fill { position: absolute; inset: 0; transition: transform .9s var(--ease); }
.glass .liq .top { position: absolute; top: -5px; left: 0; right: 0; height: 10px; border-radius: 50%; background: var(--glow); filter: brightness(1.25); transition: background-color .6s; }
.glass .shine { position: absolute; top: 18px; bottom: 34px; left: 10px; width: 5px; border-radius: 5px; background: linear-gradient(rgba(255,255,255,.5), rgba(255,255,255,.08) 70%, transparent); }
.glass .marks { position: absolute; right: 3px; top: 6px; bottom: 0; width: 9px; }
.glass .marks i { position: absolute; right: 0; width: 8px; height: 1px; background: rgba(243,246,245,.45); }
.glass .stream { position: absolute; top: 4px; left: 50%; width: 4px; margin-left: -2px; height: 100%; border-radius: 4px; background: var(--glow); transform: scaleY(0); transform-origin: top; opacity: 0; }
.glass.pour .stream { animation: pour .75s ease-in; }
@keyframes pour { 0% { transform: scaleY(0); opacity: 1; } 45% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }

.col { min-width: 0; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
#app { flex: 1; display: flex; flex-direction: column; }
#app > * { animation: enter .35s var(--ease); }
@keyframes enter { from { transform: translateX(10px); opacity: .4; } }

.btn { min-height: 54px; border: 0; border-radius: 27px; padding: 0 24px; cursor: pointer; font-weight: 700; font-size: 17px; background: var(--fg); color: #0A0D0D; transition: background-color .15s, opacity .15s; }
.btn:hover { background: #fff; } .btn:active { opacity: .8; }
.btn.line { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1.5px rgba(243,246,245,.5); }
.btn.line:hover { background: var(--card); }
.btn.text { background: transparent; color: var(--mute); font-weight: 500; font-size: 15px; min-height: 48px; padding: 0 8px; }
.btn[disabled] { opacity: .55; cursor: default; }

/* 첫 화면 */
.hero { flex: 1; display: flex; flex-direction: column; padding: 28px 0 calc(24px + env(safe-area-inset-bottom, 0px)); gap: 20px; }
.hero .logo { width: 148px; height: auto; filter: invert(1); align-self: flex-start; }
.hero .title { margin-top: auto; }
.hero .mark { width: 52px; height: 52px; display: block; margin-bottom: 20px; }
.hero h1 { margin: 0; font-weight: 800; font-size: clamp(38px, 11vw, 56px); line-height: 1.18; letter-spacing: -.045em; }
.hero .lead { margin: 16px 0 0; color: var(--mute); font-size: 16px; max-width: 22em; }
.hero .btn { width: 100%; margin-top: 12px; }

/* 질문 */
.bar { display: flex; align-items: center; justify-content: space-between; height: 64px; margin-left: -12px; }
.iconbtn { width: 48px; height: 48px; display: grid; place-items: center; background: none; border: 0; color: var(--fg); cursor: pointer; border-radius: 50%; }
.iconbtn:hover { background: var(--card); }
.count { font-size: 15px; color: var(--mute); font-variant-numeric: tabular-nums; }
.count b { color: var(--fg); font-weight: 700; }
.q { flex: 1; display: flex; flex-direction: column; }
.q h2 { margin: 12px 0 0; font-weight: 800; font-size: clamp(28px, 8vw, 38px); line-height: 1.26; letter-spacing: -.04em; text-wrap: balance; }
.q .why { margin: 12px 0 0; color: var(--mute); font-size: 15px; line-height: 1.55; }
.opts { display: grid; gap: 8px; margin: 28px 0 24px; }
.opt { --edge: color-mix(in oklab, var(--c, #8A9896) 62%, white); position: relative; text-align: left; color: var(--fg); background: var(--card); border: 0; border-radius: 16px; cursor: pointer;
  min-height: 64px; padding: 12px 16px; display: flex; flex-direction: column; justify-content: center; transition: background-color .18s, box-shadow .18s; }
.opt b { font-weight: 700; font-size: 17px; line-height: 1.35; letter-spacing: -.025em; }
.opt small { font-size: 14px; color: var(--mute); line-height: 1.45; margin-top: 2px; }
.opt:hover { background: rgba(243,246,245,.09); }
.opt:active { background: rgba(243,246,245,.14); }
.opt[aria-pressed="true"] { background: color-mix(in oklab, var(--c, #8A9896) 34%, #070909); box-shadow: inset 0 0 0 2px var(--edge); }
.opt[aria-pressed="true"] small { color: #DCE5E4; }
.opts.chips { display: flex; flex-wrap: wrap; gap: 10px 8px; }
.opts.chips .opt { min-height: 50px; padding: 0 18px; border-radius: 25px; }
.opts.chips .opt b { font-size: 16px; font-weight: 600; }
.opts.chips small { display: none; }
.opt.none { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.opt.none b { font-weight: 500; color: var(--mute); }
.nav { position: sticky; bottom: 0; margin-top: auto; padding: 20px 0 calc(20px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.nav .btn { width: 100%; pointer-events: auto; box-shadow: 0 0 32px 12px rgba(7,9,9,.75); }

/* 결과 */
body.done .stage { display: block; }
body.done .tubecol { position: absolute; left: var(--gut-l); top: 40px; height: 270px; width: 76px; padding: 0; }
body.done .glass { width: 76px; }
body.done .glass .body { border-radius: 0 0 35px 35px; }
.reshead { min-height: 342px; padding: 0 0 12px 100px; display: flex; flex-direction: column; justify-content: center; }
.reshead h2 { margin: 0; font-weight: 800; font-size: clamp(30px, 8.6vw, 44px); line-height: 1.22; letter-spacing: -.045em; }
.reshead p { margin: 14px 0 0; color: var(--mute); font-size: 15px; }
.picks { display: grid; gap: 20px; margin-top: 24px; }
.item { background: var(--card); border-radius: 24px; padding: 24px 20px 20px; display: grid; gap: 16px; }
.item.first { background: color-mix(in oklab, var(--glow) 24%, #070909); }
.item .rank { font-size: 14px; color: var(--mute); display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
.item.first .rank { color: #D5DFDE; }
.item h3 { margin: -4px 0 0; font-weight: 500; }
.item .en { display: block; font-family: var(--name); font-weight: 500; font-size: clamp(40px, 11.5vw, 54px); line-height: 1.02; letter-spacing: -.02em; overflow-wrap: anywhere; }
.item .ko { display: block; font-weight: 600; font-size: 16px; margin-top: 8px; }
.item .line { font-size: 16px; line-height: 1.6; }
.item .spec { display: grid; grid-template-columns: 1fr auto; gap: 16px; border-block: 1px solid var(--line); padding: 12px 0; }
.item .spec dt { font-size: 13px; color: var(--mute); } .item .spec dd { margin: 2px 0 0; font-weight: 600; font-size: 16px; }
.item .spec, .recipe { margin: 0; }
.item.first .spec dt, .item.first .from small, .item.first .hits { color: #D5DFDE; }
.item .hits { margin: 0; font-size: 15px; color: var(--mute); }
.item .from { margin: 0; font-size: 16px; line-height: 1.65; }
.order { display: grid; gap: 12px; } .order:empty { display: none; }
.order .btn { width: 100%; }
.order label { display: grid; gap: 6px; font-size: 15px; }
.order input { min-height: 52px; font-size: 16px; padding: 0 16px; border: 1.5px solid rgba(243,246,245,.45); border-radius: 14px; width: 100%; background: rgba(7,9,9,.5); color: var(--fg); }
.order input::placeholder { color: var(--mute); }
.wait { border-radius: 16px; background: rgba(7,9,9,.45); padding: 16px; font-weight: 600; font-size: 16px; line-height: 1.5; }
.wait small { display: block; color: #C3CFCE; font-weight: 400; font-size: 14px; margin-top: 4px; }
.wait.on::before { content: ""; display: block; height: 3px; border-radius: 3px; margin-bottom: 12px; background: var(--nm); transform-origin: left; animation: wait 2.4s ease-in-out infinite; }
@keyframes wait { 0% { transform: scaleX(.08); } 50% { transform: scaleX(1); } 100% { transform: scaleX(.08); } }
.got h4 { margin: 0 0 12px; font-size: 18px; font-weight: 700; }
.recipe { display: grid; gap: 12px; font-size: 16px; }
.recipe dt { color: #C3CFCE; font-size: 13.5px; } .recipe dd { margin: 2px 0 0; white-space: pre-line; }
.mine { display: grid; gap: 12px; margin-top: 24px; } .mine:empty { display: none; }
.mine .box { background: var(--card); border-radius: 20px; padding: 18px 18px 20px; display: grid; gap: 12px; }
.mine .box > b { font-weight: 700; font-size: 17px; }
.coda { padding: 36px 0 8px; color: var(--mute); font-size: 15px; }
.endnav { display: grid; gap: 4px; }
.err { box-shadow: inset 0 0 0 1.5px var(--err); border-radius: 14px; padding: 14px 16px; font-size: 15px; }
footer { display: none; } body.done footer { display: grid; gap: 14px; padding: 32px 0 calc(40px + env(safe-area-inset-bottom, 0px)); color: var(--mute); font-size: 13.5px; }
footer img { width: 120px; height: auto; filter: invert(1); opacity: .85; }
@media (min-width: 700px) { .stage { grid-template-columns: 84px minmax(0, 1fr); column-gap: 56px; } .glass { width: 72px; } .glass .body { border-radius: 0 0 33px 33px; } }
@media (prefers-reduced-motion: reduce) { .glass .liq, .glass .liq .fill, .halo, #app > * { transition: none; animation: none; } .glass.pour .stream, .wait.on::before { animation: none; } }

/* WebGL 시험관: 켜지면 CSS 시험관을 숨기고 캔버스를 쓴다 */
.glass canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.glass.hasgl > :not(canvas) { display: none; }
.stage { grid-template-columns: 64px minmax(0, 1fr); column-gap: 20px; }
.tubecol { margin-left: -6px; } .glass { width: 64px; }
body.intro .stage { grid-template-columns: clamp(84px, 27vw, 128px) minmax(0, 1fr); column-gap: 18px; }
body.intro .glass { width: 100%; } body.intro .tubecol { margin-left: -10px; }
.hero h1 { font-size: clamp(32px, 10.4vw, 56px); }
body.done .tubecol { width: 92px; height: 286px; top: 32px; margin-left: 0; } body.done .glass { width: 92px; } body.done .reshead { padding-left: 116px; }
@media (min-width: 700px) { .stage { grid-template-columns: 92px minmax(0, 1fr); column-gap: 52px; } .glass { width: 92px; } body.intro .stage { grid-template-columns: 136px minmax(0, 1fr); } }
