:root {

  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6;
  word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; }

.wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 0 max(18px, env(safe-area-inset-right, 0px)) 56px max(18px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.wrap > * { min-width: 0; }
.btn { font-family: var(--sans); font-weight: 700; font-size: 16px; cursor: pointer; background: var(--amber); color: #1B120C; border: 0; border-radius: 999px; padding: 14px 22px; letter-spacing: -.01em; }

.hero .motto { margin: 6px 0 0; font-family: var(--serif); font-weight: 600; font-size: clamp(22px, 6vw, 28px); line-height: 1.5; text-wrap: balance; letter-spacing: -.02em; }

.hero .how { font-size: 14.5px; color: var(--gray); margin: 0; }
.hero .btn { width: 100%; padding: 16px; font-size: 17px; }

/* 질문 화면 머리 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--paper); padding: 16px 0 12px; display: grid; gap: 12px; border-bottom: 1px solid var(--line); }

.brand { display: inline-flex; align-items: center; gap: 8px; font-family: var(--latin); font-weight: 700; font-size: 13px; letter-spacing: .2em; color: var(--ink); }

.count b { color: var(--ink); font-weight: 600; font-size: 20px; }
.rack { display: grid; grid-template-columns: repeat(10, 1fr); gap: clamp(5px, 2vw, 10px); align-items: end; padding: 0 4px; }
.tube { position: relative; height: 30px; border: 1.5px solid rgba(241,232,218,.75); border-top: 0; border-radius: 0 0 999px 999px; overflow: hidden; }
.tube i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--c, var(--nm)); box-shadow: 0 0 12px var(--c, var(--nm)); transition: height .5s cubic-bezier(.3,.7,.2,1); }

.tube.now { border-color: var(--amber); }

/* 질문 */

.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 18px; }
.opt { font: inherit; color: var(--ink); background: transparent; text-align: left; cursor: pointer; border: 0; border-bottom: 1px solid var(--line);
  padding: 14px 4px; min-height: 58px; display: grid; grid-template-columns: 14px 1fr auto; gap: 14px; align-items: center; transition: background-color .2s; }
.opt > span { min-width: 0; }
.vial { position: relative; width: 12px; height: 28px; border: 1.5px solid rgba(241,232,218,.7); border-top: 0; border-radius: 0 0 99px 99px; overflow: hidden; }
.vial::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 28%; background: var(--c, #5A4F49); transition: height .3s cubic-bezier(.3,.7,.2,1), box-shadow .3s; }
.opt b { display: block; font-weight: 600; font-size: 17px; line-height: 1.35; letter-spacing: -.02em; overflow-wrap: anywhere; }
.opt small { display: block; font-size: 13.5px; color: var(--gray); line-height: 1.45; margin-top: 2px; }
.opt .tick { width: 20px; height: 20px; border: 1.5px solid var(--gray); border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: transparent; }
.opt:hover { background: rgba(241,232,218,.03); }
.opt:hover .vial::after { height: 55%; }
.opt[aria-pressed="true"] { background: rgba(243,181,98,.07); }
.opt[aria-pressed="true"] b { color: var(--amber); }
.opt[aria-pressed="true"] .vial { border-color: var(--ink); }
.opt[aria-pressed="true"] .vial::after { height: 90%; box-shadow: 0 0 14px var(--c, var(--amber)); }
.opt[aria-pressed="true"] .tick { background: var(--amber); border-color: var(--amber); color: #1B120C; }
.opt.none b { color: var(--gray); font-weight: 500; }
.nav { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px; margin-top: 6px; }

.picks { display: grid; gap: 28px; padding-top: 6px; }
.item { display: grid; gap: 12px; padding: 22px 0 0; border-top: 1px solid var(--line); position: relative; }

.item h3 .ko { display: block; font-family: var(--serif); font-size: 15px; color: var(--gray); margin-top: 6px; }
.item .line { font-family: var(--serif); font-size: 15.5px; line-height: 1.6; }
.item .spec { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 9px 0; font-size: 15px; }
.item .spec > span:first-child { font-family: var(--name); font-size: 19px; font-style: italic; }
.item .spec b { font-weight: 700; font-size: 18px; color: var(--amber); }

.chapter b { font-family: var(--latin); font-weight: 700; color: var(--ink); margin-right: 8px; letter-spacing: .05em; }

.match i { height: 3px; background: var(--line); border-radius: 3px; position: relative; overflow: hidden; }

.origin { font-family: var(--serif); font-size: 14.5px; border-left: 2px solid var(--amber); padding: 2px 0 2px 12px; }
.origin small { display: block; color: var(--gray); font-family: var(--sans); font-size: 12.5px; margin-top: 2px; }
.recipe { margin: 10px 0 0; display: grid; grid-template-columns: 5em 1fr; gap: 10px 12px; font-size: 15px; }
.recipe dt { color: var(--gray); font-size: 13.5px; }
.recipe dd { margin: 0; white-space: pre-line; min-width: 0; }
.recipe .note { grid-column: 1 / -1; color: var(--gray); font-size: 13.5px; }
.order input { background: var(--tint); color: var(--ink); border-color: var(--line) !important; }
.order .btn.line { background: transparent !important; color: var(--amber) !important; box-shadow: inset 0 0 0 1.5px var(--amber) !important; }
.order .btn:not(.line):not(.text) { background: var(--amber); color: #1B120C; }

.got { border-top: 1px solid var(--amber) !important; }

footer { display: grid; justify-items: center; gap: 8px; padding-top: 8px; }

footer .note { font-size: 12.5px; color: var(--gray); text-align: center; max-width: 30em; }
body.asking footer, body.intro footer { display: none; }
body.intro .top { display: none; }

@media (prefers-reduced-motion: reduce) { .tube i, .vial::after, .opt { transition: none; } }
.opts.two .opt { gap: 10px; }
.opts.two .opt b { font-size: 15.5px; overflow-wrap: normal; }

.order { display: grid; gap: 10px; }
.order .btn { width: 100%; }
.order .btn.line { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }

.order label { font-size: 14px; color: var(--gray); display: grid; gap: 4px; }
.order input { font: inherit; font-size: 16px; padding: 10px 12px; border: 1.5px solid var(--ink); border-radius: 10px; width: 100%; }
.wait { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; background: var(--tint); border-radius: 10px; padding: 12px 14px; font-size: 15px; }

</style>

  const want = STYLE[ans.style];
  if (want && picks.length && !picks.some(p => p.c.style.includes(want))) {
    const alt = ranked.find(r => r.c.style.includes(want) && !picks.includes(r));
    if (alt) { if (picks.length >= 3) picks.pop(); picks.push(alt); }
  }
  const layers = Q.map((_, i) => colorOf(i) || "#DCD8D2");
  app.innerHTML = picks.length ? `
    <section class="q">
      <div class="result-top">
        <div class="big-tube" aria-hidden="true">${layers.map(c => `<span style="--c:${c}"></span>`).join("")}</div>
        <div>
          <h2>당신의 시그널에 연결된 ${picks.length}잔</h2>
          <p>열 개의 답을 한 시험관에 쌓았어요. 200잔 아카이브에서 이 시그널과 가장 가까운 잔이에요. 첫 번째 잔이 가장 강한 신호예요. 마음에 드는 잔을 고르면 Connector가 확인한 뒤 레시피가 열려요.</p>
        </div>
      </div>
      <div class="picks">${picks.map((r, k) => item(r, maxScore(), k)).join("")}</div>
      <div class="coda">
        <div class="bar">2026, SINLIM</div>
        <p>아카이브의 마지막 장은 너드커넥트의 시그니처예요.<br>오늘의 시그널을 Connector에게 보여 주면 이어지는 시그니처를 소개해 드려요.</p>
      </div>
      <div class="nav"><button class="btn text" id="back">마지막 질문으로</button><button class="btn" id="again">처음부터 다시</button></div>
    </section>` : `
    <section class="q"><div class="err">고른 조건을 모두 지키는 잔이 없어요. '이건 빼 주세요'에서 하나를 풀고 다시 찾아 주세요.</div>
      <div class="nav"><button class="btn text" id="back">'빼 주세요'로 돌아가기</button><button class="btn" id="again">처음부터 다시</button></div></section>`;
  if (picks.length) { paintOrders(null); poll(); }
  document.getElementById("back").addEventListener("click", () => { step = picks.length ? Q.length - 1 : Q.findIndex(q => q.id === "no"); renderQ(); });
  document.getElementById("again").addEventListener("click", () => { ans = {}; go(-99); });
}
fetch("cocktails.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { DATA = d; renderIntro(); })
  .catch(() => { app.innerHTML = `<div class="err">칵테일 목록을 불러오지 못했어요. 페이지를 새로고침해 주세요.</div>`; });
</script>
